name: CSC325 CI/CD

on:
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  DJANGO_SECRET_KEY: ci-only-not-secret
  DJANGO_DEBUG: "0"

jobs:
  test:
    name: "Test"
    runs-on: ubuntu-latest
    steps:
      - name: "Setup - Check out code"
        uses: actions/checkout@v4
      - name: "Setup - Install Python ${{ env.PYTHON_VERSION }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: "Dependencies - Install packages"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check
      - name: "Test - Run full test suite"
        # A failing test exits non-zero, which fails this job and blocks Deploy.
        run: python manage.py test -v 2

  deploy:
    name: "Deploy"
    needs: test
    runs-on: ubuntu-latest
    env:
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      # Placeholder until the app is hosted publicly (e.g. on Render).
      PUBLIC_URL: https://csc325-ci-cd.onrender.com
    steps:
      - name: "Setup - Check out code"
        uses: actions/checkout@v4
      - name: "Setup - Install Python ${{ env.PYTHON_VERSION }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: "Dependencies - Install packages"
        run: pip install -r requirements.txt
      - name: "Deploy - Apply migrations and start server"
        run: |
          python manage.py migrate --noinput
          python manage.py runserver 127.0.0.1:8000 --insecure &
          for i in $(seq 1 15); do
            curl --silent --output /dev/null http://127.0.0.1:8000/ && exit 0
            sleep 1
          done
          echo "Server did not start" && exit 1
      - name: "Deploy - Smoke test deployed app"
        run: |
          curl --fail --silent http://127.0.0.1:8000/ | grep -q "Hello, World!"
          curl --fail --silent http://127.0.0.1:8000/about/
          curl --fail --silent http://127.0.0.1:8000/api/health/ | grep -q '"status":"ok"'
      - name: "Deploy - Public URL"
        run: |
          echo "Deployed app available at: ${{ env.PUBLIC_URL }}"
          echo "### Deployed app: ${{ env.PUBLIC_URL }}" >> "$GITHUB_STEP_SUMMARY"
